<article class="book-card"><a class="cover" href="{{ book.get_absolute_url }}">{% if book.cover %}<img src="{{ book.cover.url }}" alt="جلد {{ book.title }}">{% else %}<div class="cover-placeholder"><span>نشر احسان</span><b>{{ book.title|truncatechars:34 }}</b><small>{{ book.author.name }}</small></div>{% endif %}</a><div class="book-info"><a class="book-title" href="{{ book.get_absolute_url }}">{{ book.title }}</a><p class="muted">{{ book.author.name }}</p><div class="book-bottom"><strong>{{ book.price|floatformat:"-2" }} <small>افغانی</small></strong>{% if book.stock %}<span class="stock">موجود</span>{% else %}<span class="out-stock">ناموجود</span>{% endif %}</div><form method="post" action="{% url 'add_to_cart' book.id %}">{% csrf_token %}<input type="hidden" name="quantity" value="1"><input type="hidden" name="next" value="{% url 'cart' %}"><button class="btn btn-outline btn-block" {% if not book.stock %}disabled{% endif %}>افزودن به سبد</button></form></div></article>
